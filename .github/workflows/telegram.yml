
name: Test Telegram Access

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check Telegram post
        run: |
          python - <<'PY'
          import urllib.request

          url = "https://t.me/s/yvtelevizya/11540"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as r:
              html = r.read(500000).decode(
                  "utf-8", errors="replace"
              )
              print("HTTP status:", r.status)
              print("Video tag found:", "video" in html.lower())
              print("Telegram media found:",
                    "tgme_widget_message_video" in html)
          PY
