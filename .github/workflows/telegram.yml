
name: Test Telegram Access

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect Telegram post
        run: |
          python - <<'PY'
          import urllib.request
          import re

          urls = [
              "https://t.me/yvtelevizya/11540?embed=1",
              "https://t.me/s/yvtelevizya/11540"
          ]

          for url in urls:
              print("\nChecking:", url)
              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      }
                  )

                  with urllib.request.urlopen(
                      req, timeout=30
                  ) as r:
                      html = r.read().decode(
                          "utf-8", errors="replace"
                      )

                  print("HTML length:", len(html))
                  print("Post ID found:",
                        "yvtelevizya/11540" in html)
                  print("MP4 reference:",
                        ".mp4" in html.lower())
                  print("Video references:",
                        len(re.findall(
                            r'video|video_url',
                            html, re.I
                        )))
                  print("Telegram widget:",
                        "tgme_widget_message" in html)

              except Exception as e:
                  print("ERROR:", str(e))
          PY
